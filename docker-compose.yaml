services:
  db:
    image: postgres:15
    container_name: db_docker_symfony
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: admin
    networks:
      - dev

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_docker_symfony
    restart: always
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - dev

  www:
    build: .
    container_name: www_docker_symfony
    restart: always
    depends_on:
      - db  
    ports:
      - "8741:80"
    volumes:
      - ./vhosts:/etc/apache2/sites-enabled 
      - ./public:/var/www/html
      - ./:/var/www 
    networks:
      - dev

volumes:
  db_data:

networks:
  dev:




  
       