fo_controllers:
    resource:
        path: ../src/Controller/Fo
        namespace: App\Controller\Fo
    type: attribute
    prefix: /
    name_prefix: app.fo.
    defaults: { _locale: 'fr' }
    requirements:
        _locale: fr|en
        
controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

connect_google_start:
    path: /connect/google
    controller: App\Controller\SecurityController::connectGoogle

connect_google_check:
    path: /connect/google/check