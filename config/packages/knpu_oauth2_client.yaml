knpu_oauth2_client:
    clients:
        google:
            type: google
            client_id: '%env(GOOGLE_OAUTH_CLIENT_ID)%'
            client_secret: '%env(GOOGLE_OAUTH_CLIENT_SECRET)%'
            # route qui déclenche le callback (celle mise chez Google)
            redirect_route: connect_google_check
            # scopes supplémentaires si besoin
            # redirect_params: {}   # (optionnel)
            # hosted_domain: 'mon-domaine.com'   # (optionnel: GSuite)